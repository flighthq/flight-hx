name: hostClay native smoke

# Confirms hostClay's core native paths actually build and RUN on a stock Ubuntu
# runner (hxcpp), headless: software Mesa GL under Xvfb + an ALSA null device.
# It exercises the same native libraries hostClay's adapters call (linc_opengl,
# linc_stb, SDL, SoLoud) and asserts real results, failing the job on any regress.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'src/flight/hostClay/**'
      - 'tests/host-clay/native-smoke/**'
      - '.github/workflows/hostclay-native-smoke.yml'
  pull_request:
    paths:
      - 'src/flight/hostClay/**'
      - 'tests/host-clay/native-smoke/**'
      - '.github/workflows/hostclay-native-smoke.yml'

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libglew-dev libgl1-mesa-dev libgl1-mesa-dri mesa-utils \
            libx11-dev libasound2-dev libopenal-dev xvfb

      - name: Set up Haxe + hxcpp
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - run: haxelib install hxcpp --always --quiet

      - name: Fetch Clay + linc native deps
        run: bash tests/host-clay/native-smoke/setup-native.sh "$RUNNER_TEMP/native-deps"

      - name: Compile the native smoke (hxcpp)
        run: |
          haxe -cp tests/host-clay/native-smoke \
            -lib clay -lib linc_opengl -lib linc_stb -lib linc_soloud \
            -D clay -D clay_native -main NativeSmoke -cpp build/native-smoke

      - name: Run the native smoke (Xvfb + software GL + ALSA null)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 128x128x24 -ac" ./build/native-smoke/NativeSmoke

# Full upstream parity sweep, sharded across parallel jobs. Too heavy for
# per-push CI (the complete corpus is ~16k tests and hours of wall clock on a
# hosted runner), so it runs nightly and on demand. Each shard takes a
# deterministic sixth of the sorted package list (tools/test-upstream.mjs
# --shard i/6 partitions exactly: every package lands in one shard), so a
# shard report distinguishes reviewed failures, unreviewed failures, and fixes;
# only runner crashes fail the report-only workflow.
name: parity
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/toolchain
      - name: Build JavaScript bundle
        run: npm run build:haxe:js
      - name: Run shard ${{ matrix.shard }} of 6
        run: node tools/test-upstream.mjs --shard ${{ matrix.shard }}/6 --jobs 3
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-shard-${{ matrix.shard }}
          path: reports/upstream-parity-shard-*.json

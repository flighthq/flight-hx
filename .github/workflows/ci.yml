name: bindings
on:
  push:
  pull_request:
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: ./.github/actions/toolchain
      - run: npm run rehydrate
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .dependencies/flight/target
          key: rust-${{ runner.os }}-1.96.0-${{ hashFiles('dependencies.lock.json') }}
      - run: cargo fetch --locked --manifest-path .dependencies/flight/Cargo.toml
      - run: npm run check
      - run: npm run package:haxelib
      - uses: actions/upload-artifact@v4
        with:
          name: flight-haxelib
          path: dist/flight-*.zip

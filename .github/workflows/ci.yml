name: bindings
on:
  push:
  pull_request:
concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  esm:
    name: real ESM runtime + tree-shaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - run: npm run rehydrate
      - run: npm run gate:web
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: ./.github/actions/toolchain
        with:
          neko: 'true'
      - run: npm run setup:native-tests
      - run: npm run rehydrate
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .artifacts/flight-source-*/target
          key: rust-${{ runner.os }}-1.96.0-${{ hashFiles('dependencies.lock.json', 'patches/flight/**') }}
      - run: cargo fetch --locked --manifest-path .dependencies/flight/Cargo.toml
      - run: npm run check
      - run: npm run package:haxelib
      - uses: actions/upload-artifact@v4
        with:
          name: flight-linux64-dev
          path: dist/flight-*.zip

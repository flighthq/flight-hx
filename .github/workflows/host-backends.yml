name: host backends

# Confirms Flight's host backends actually BUILD and RUN on GitHub Actions —
# one job per backend, each fanned out across operating systems so a per-OS
# regression is visible by name. These gates are heavyweight (native hxcpp
# compiles, a real browser) and touch the network (Clay/linc clones, Playwright),
# so they live outside the fast, fully-pinned ci.yml per-push lane (mirroring
# parity.yml's split) and are path-filtered to the host sources they cover.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'src/flight/hostClay/**'
      - 'src/flight/hostLime/**'
      - 'tests/host-clay/**'
      - 'tests/host-web/**'
      - 'tests/host-lime/**'
      - '.github/workflows/host-backends.yml'
      - '.github/actions/toolchain/**'
      - 'tools/setup-haxe.mjs'
      - '.haxerc'
      - 'haxe_libraries/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/flight/hostClay/**'
      - 'src/flight/hostLime/**'
      - 'tests/host-clay/**'
      - 'tests/host-web/**'
      - 'tests/host-lime/**'
      - '.github/workflows/host-backends.yml'
      - '.github/actions/toolchain/**'
      - 'tools/setup-haxe.mjs'
      - '.haxerc'
      - 'haxe_libraries/**'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: host-backends-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clay-native:
    # hostClay's core native paths on hxcpp across two OSes: Linux (software Mesa
    # GL under Xvfb + an ALSA null device) and macOS (system GL + CoreAudio).
    # Exercises the same native libraries the Clay adapters call (linc_opengl,
    # linc_stb, SDL, SoLoud) and asserts real results. Windows-native is a
    # follow-up (its SDL/GLEW/hxcpp toolchain is a separate setup).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libglew-dev libgl1-mesa-dev libgl1-mesa-dri mesa-utils \
            libx11-dev libasound2-dev libopenal-dev xvfb
      - name: Install system native libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 glew

      - name: Set up Haxe + hxcpp
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - run: haxelib install hxcpp --always --quiet

      - name: Fetch Clay + linc native deps (pinned)
        run: bash tests/host-clay/native-smoke/setup-native.sh "$RUNNER_TEMP/native-deps"

      - name: Compile the native smoke (hxcpp)
        run: |
          haxe -cp tests/host-clay/native-smoke \
            -lib clay -lib linc_opengl -lib linc_stb -lib linc_soloud \
            -D clay -D clay_native -main NativeSmoke -cpp build/native-smoke

      - name: Run the native smoke (Linux — Xvfb + software GL + ALSA null)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 128x128x24 -ac" ./build/native-smoke/NativeSmoke
      - name: Run the native smoke (macOS — system GL + CoreAudio)
        if: runner.os == 'macOS'
        run: ./build/native-smoke/NativeSmoke

  lime-host:
    # hostLime on the real openfl/lime toolchain (restored by the shared toolchain
    # action via `npm run setup`): the portable interp smoke + html5 JS compile on
    # all three major OSes, plus a real native Lime window smoke on Linux (below).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    # ci.yml's Haxe jobs are all -cp-only, so this is the first CI job to use
    # `-lib`. Scoped-lib resolution the toolchain action does not wire up: resolve
    # libraries from the committed haxe_libraries/ via HAXELIB_PATH (Haxe reads
    # <lib>.hxml there natively). HAXE_LIBCACHE is set in the first step (below).
    env:
      HAXELIB_PATH: ${{ github.workspace }}/haxe_libraries
    steps:
      - uses: actions/checkout@v4
      # lix downloads into a temp on the home volume, then MOVES each library into
      # HAXE_LIBCACHE. On Windows the workspace (D:) and home dir (C:) are different
      # volumes and a cross-volume move fails, so point HAXE_LIBCACHE at the home
      # volume — matching lix's temp and the web-browser job's working default.
      - name: Point HAXE_LIBCACHE at the home volume
        shell: bash
        run: echo "HAXE_LIBCACHE=$HOME/haxe/haxe_libraries" >> "$GITHUB_ENV"
      - uses: ./.github/actions/toolchain
        with:
          # Neko powers `haxelib run lime` for the native smoke; its install step
          # is apt-only, so only request it on Linux (the native leg's OS).
          neko: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      - name: Put the pinned haxelib on PATH
        shell: bash
        run: echo "${{ github.workspace }}/.haxe/4.3.7" >> "$GITHUB_PATH"
      - name: hostLime interp smoke
        run: npm run test:haxe:lime
      - name: hostLime html5 compile
        run: npm run test:haxe:lime:html5
      # Native Lime window smoke — Linux only: a real hxcpp build via `haxelib run
      # lime` plus a windowed GL readback under Xvfb + software Mesa. run.mjs keeps
      # the job's HAXE_LIBCACHE but overrides HAXELIB_PATH to a repo-local .haxelib
      # it builds: it maps the pinned deps there and installs the exact-version Lime
      # release for the Linux64 ndll the scoped GitHub source omits.
      - name: Install Xvfb + Mesa DRI (native smoke)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dri xvfb
      - name: hostLime native window smoke
        if: runner.os == 'Linux'
        run: npm run test:haxe:lime:native

  web-browser:
    # hostWeb: the compiled Flight SDK loaded and initialized in a REAL headless
    # Chromium, plus a real WebGL2 render + readback — the web analog of
    # clay-native's GL smoke, run in the browser on all three major OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: Build Flight to JS
        run: npm run build:haxe:js
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm i --no-save playwright
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Run the browser smoke
        run: node tests/host-web/browser-smoke/smoke.mjs
